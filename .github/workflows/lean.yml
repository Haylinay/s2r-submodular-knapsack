name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Installs the Lean version from verification/lean-toolchain, retrieves
      # Mathlib's precompiled cache, and builds the verification Lake package.
      - name: Build Lean proof
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification
          build: true
          test: false
          lint: false
          mk_all-check: false
          use-mathlib-cache: true

      - name: Audit the S2R theorem and axioms
        working-directory: verification
        run: python3 -B verify_s2r.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2r-audit
          path: |
            verification/audit/verification_report.json
            verification/audit/axioms.log
            verification/audit/*.log
          if-no-files-found: warn
